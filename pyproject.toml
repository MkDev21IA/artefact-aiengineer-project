[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Conversational AI customer support agent for Emporio da Musica (Artefact AI Engineer Challenge)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [
    { name = "MkDev21IA" },
]
dependencies = [
    "openai>=1.55.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "polars>=1.15.0",
    "pymupdf>=1.24.13",
    "chromadb>=0.5.20",
    "fastembed>=0.4.2",
    "semantic-router>=0.0.72",
    "presidio-analyzer>=2.2.355",
    "presidio-anonymizer>=2.2.355",
    "spacy>=3.8.0,<3.9.0",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
